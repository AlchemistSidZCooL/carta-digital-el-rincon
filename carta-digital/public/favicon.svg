<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- Premium dark gradient for the base -->
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a24" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>
    
    <!-- Spain red/yellow -->
    <linearGradient id="spain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C60B1E" />
      <stop offset="100%" stop-color="#F1BF00" />
    </linearGradient>

    <!-- Brazil green/yellow -->
    <linearGradient id="brazil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#009B3A" />
      <stop offset="100%" stop-color="#F1BF00" />
    </linearGradient>
  </defs>

  <!-- Main rounded rectangle (the "Rincón") -->
  <rect x="10" y="10" width="100" height="100" rx="24" fill="url(#base)" />

  <!-- Top arc representing a serving cloche (Campana de restaurante) -->
  <path d="M 30 55 C 30 25, 90 25, 90 55" fill="none" stroke="url(#spain)" stroke-width="8" stroke-linecap="round" />
  
  <!-- Bottom arc representing a plate/bowl -->
  <path d="M 30 65 C 30 95, 90 95, 90 65" fill="none" stroke="url(#brazil)" stroke-width="8" stroke-linecap="round" />

  <!-- Center R for Rincón -->
  <text x="60" y="74" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#D4AF37" text-anchor="middle">R</text>

  <!-- Subtle glow/glass border -->
  <rect x="10" y="10" width="100" height="100" rx="24" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
</svg>